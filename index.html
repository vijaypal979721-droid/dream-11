<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agri - Fantasy Cricket Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header / Navbar -->
  <header class="navbar">
    <div class="logo">Agri</div>
    <div class="nav-right">
      <span class="wallet">💰 Balance: ₹500</span>
      <button class="profile-btn">Profile</button>
    </div>
  </header>

  <!-- Main Dashboard Container -->
  <main class="dashboard">
    <!-- Center Background Text -->
    <div class="background-text">CRICKET</div>

    <!-- Dashboard Content -->
    <section class="dashboard-content">
      <h2>Upcoming Matches</h2>
      <p class="subtitle">Dream11 style fantasy contests join karein</p>

      <div class="matches-grid">
        <!-- Match Card 1 -->
        <div class="match-card">
          <div class="league">T20 World Cup</div>
          <div class="teams">
            <span class="team">IND</span>
            <span class="vs">VS</span>
            <span class="team">PAK</span>
          </div>
          <div class="match-time">Start in 2h 30m</div>
          <div class="contest-info">
            <span>Mega Contest: ₹1 Crore</span>
            <button class="join-btn">Join ₹49</button>
          </div>
        </div>

        <!-- Match Card 2 -->
        <div class="match-card">
          <div class="league">IPL 2026</div>
          <div class="teams">
            <span class="team">CSK</span>
            <span class="vs">VS</span>
            <span class="team">RCB</span>
          </div>
          <div class="match-time">Today, 7:30 PM</div>
          <div class="contest-info">
            <span>Prize Pool: ₹50 Lakhs</span>
            <button class="join-btn">Join ₹33</button>
          </div>
        </div>

        <!-- Match Card 3 -->
        <div class="match-card">
          <div class="league">Big Bash League</div>
          <div class="teams">
            <span class="team">AUS</span>
            <span class="vs">VS</span>
            <span class="team">ENG</span>
          </div>
          <div class="match-time">Tomorrow, 1:30 PM</div>
          <div class="contest-info">
            <span>Prize Pool: ₹20 Lakhs</span>
            <button class="join-btn">Join ₹19</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
